<!DOCTYPE html>
<html lang="en" dir="ltr" prefix="og: https://ogp.me/ns#" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Kosal Nith</title>

  <meta property="og:title"   content="Gallery">
  <meta property="og:url"     content="https://kosalnith.github.io/gallery.html">
  <link rel="canonical"       href="https://kosalnith.github.io/gallery.html">
  <meta name="twitter:title"  content="Gallery">

  <link rel="stylesheet" media="all" href="static/css/main.css">
  <link rel="stylesheet" media="all" href="static/css/mainformat.css">
  <link rel="stylesheet" media="all" href="static/css/darkmode.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="static/css/gallery.css">
</head>

<body class="page-gallery section-gallery not-front role--anonymous">
<div class="dialog-off-canvas-main-canvas" data-off-canvas-main-canvas="">

  <div id="site-header"></div>

  <main class="page-content" id="page-content">
    <div id="block-stanford-basic-content"
         class="system-main-block block-system block-stanford-basic-content">
      <section class="node basic-page node--layout-full">
        <div class="content">

          <section class="gallery-section" id="gallery" data-js="panel">

            <!-- ── Page header ── -->
            <header class="gallery-header">
              <div class="gallery-header-left">
                <div class="gallery-eyebrow">Kosal Nith &mdash; Selected Works</div>
                <h2 class="gallery-title">Photo<br><em>Gallery</em></h2>
              </div>
              <p class="gallery-subtitle">
                Research, fieldwork,<br>
                people &amp; places<br>
                &mdash; documented.
              </p>
            </header>

            <!-- ── Section nav buttons (injected by gallery.js) ── -->
            <nav class="gallery-nav" id="gallery-nav" aria-label="Gallery sections"></nav>

            <!-- ── Active section label + count ── -->
            <div class="gallery-section-label" id="gallery-section-label">
              <span id="gallery-label-text"></span>
              <span id="gallery-label-count"></span>
            </div>

            <!-- ── Photo grid (injected by gallery.js) ── -->
            <div class="gallery-grid-wrapper">
              <div class="gallery-grid" id="gallery-grid"></div>
            </div>

            <!-- ── Pagination ── -->
            <nav class="gallery-pagination" id="gallery-pagination" aria-label="Gallery pages"></nav>

          </section>

        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

</div>

<!-- ════════════ LIGHTBOX ════════════ -->
<div class="lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lightbox-backdrop" id="lb-backdrop"></div>
  <div class="lightbox-panel">

    <div class="lightbox-img-area">
      <button class="lightbox-close" id="lb-close" aria-label="Close">
        <i class="fa fa-xmark"></i>
      </button>
      <img id="lb-img" src="" alt="" style="opacity:0;">
    </div>

    <div class="lightbox-info" id="lb-info">
      <div class="lb-cat-badge" id="lb-tag">Category</div>
      <h3 class="lb-title"  id="lb-title">Title</h3>
      <p  class="lb-desc"   id="lb-desc">Description.</p>
      <hr class="lb-divider">
      <div class="lb-meta-row"><span>Location</span><span id="lb-location">&mdash;</span></div>
      <div class="lb-meta-row"><span>Year</span>    <span id="lb-date">&mdash;</span></div>
      <div class="lb-meta-row"><span>Photo</span>   <span id="lb-index">1 / 50</span></div>
      <div class="lb-progress-wrap">
        <div class="lb-progress-fill" id="lb-progress" style="width:2%"></div>
      </div>
      <div class="lb-nav">
        <button class="lb-nav-btn" id="lb-prev"><i class="fa fa-arrow-left"></i> Previous</button>
        <button class="lb-nav-btn" id="lb-next">Next <i class="fa fa-arrow-right"></i></button>
      </div>
    </div>

  </div>
</div>
<!-- END LIGHTBOX -->

<script src="static/js/components.js"></script>
<script src="static/js/darkmode.js"></script>
<script src="static/js/search.js"></script>
<script src="static/js/gallery.js"></script>
</body>
</html>
