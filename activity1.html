<!DOCTYPE html>
<html lang="en" dir="ltr" prefix="og: https://ogp.me/ns#" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity | Kosal Nith</title>

  <!-- Page-specific meta -->
  <meta property="og:title"  content="Activity">
  <meta property="og:url"    content="https://kosalnith.github.io/activity.html">
  <link rel="canonical"      href="https://kosalnith.github.io/activity.html">
  <meta name="twitter:title" content="Activity">

  <!-- Shared styles -->
  <link rel="stylesheet" media="all" href="static/css/main.css">
  <link rel="stylesheet" media="all" href="static/css/mainformat.css">
  <link rel="stylesheet" media="all" href="static/css/darkmode.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Page-specific CSS (only on activity.html) -->
  <link rel="stylesheet" media="all" href="static/css/activity-widget.css">

  <!--
    Favicons, icons, modernizr, Google Analytics,
    og:site_name, og:type, twitter:card injected by components.js
  -->
</head>
<body class="page-activity section-activity not-front role--anonymous">

  <div class="dialog-off-canvas-main-canvas" data-off-canvas-main-canvas="">

    <!-- ✅ HEADER SLOT — components.js injects the full header here -->
    <div id="site-header"></div>

    <main class="page-content" id="page-content">
  <div data-drupal-messages-fallback="" class="hidden"></div>
  <div id="block-stanford-basic-content" class="system-main-block block-system block-stanford-basic-content">
    <section class="node basic-page node--layout-full">
      <div class="content">
        <div class="jumpstart-ui--one-column">
          <div class="main-region"></div>
        </div>

        <div class="jumpstart-ui--two-column flex-container centered-container">
          <!-- Left sidebar (empty, hidden by site CSS) -->
          <div class="left-region flex-lg-3-of-12">
            <div class="menu-block main block block-menu navigation menu--main">
              <h2 aria-hidden="true" class="visually-hidden" id="menu-blockmain-menu">Main navigation</h2>
              <br><br>
            </div>
          </div>

          <!-- Main region -->
          <div class="flex-lg-9-of-12 main-region">
            <div class="jumpstart-ui-skipnav-main-anchor block-jumpstart-ui">
              <div id="main-content" tabindex="-1" class="visually-hidden focusable">Main content start</div>
            </div>
            <div class="field-block node-stanford-page-su-page-components block-layout-builder">
              <div class="node stanford-page su-page-components entity-reference-revisions label-hidden">
                <div class="paragraph-item ptype-stanford-layout">
                  <div class="ptype-stanford-layout paragraph paragraph--type--stanford-layout paragraph--view-mode--default">
                    <div class="layout layout--layout-paragraphs-one-column">
                      <div class="layout__region layout__region--main">
                        <div class="ptype-stanford-wysiwyg paragraph paragraph--type--stanford-wysiwyg paragraph--view-mode--default">
                          <div class="su-wysiwyg-text paragraph stanford-wysiwyg text-long label-hidden">

                            <!-- ✦ RESEARCH ACTIVITIES WIDGET ✦ -->
                            <div class="research-container">

                              <!-- Header: title + type pills -->
                              <div class="research-header">
                                <div class="research-title">Research Activities</div>
                                <div class="type-pills">
                                  <button class="type-pill" data-filter-type="all">
                                    <span class="pill-number" id="totalActivitiesCount">0</span>
                                    <span class="pill-label">All</span>
                                  </button>
                                  <button class="type-pill" data-filter-type="Conference presentation">
                                    <span class="pill-number" id="confCount">0</span>
                                    <span class="pill-label">Conference presentation</span>
                                  </button>
                                  <button class="type-pill" data-filter-type="Seminar">
                                    <span class="pill-number" id="seminarCount">0</span>
                                    <span class="pill-label">Seminar</span>
                                  </button>
                                  <button class="type-pill" data-filter-type="Workshop">
                                    <span class="pill-number" id="workshopCount">0</span>
                                    <span class="pill-label">Workshop</span>
                                  </button>
                                  <button class="type-pill" data-filter-type="Organisation">
                                    <span class="pill-number" id="orgCount">0</span>
                                    <span class="pill-label">Organisation</span>
                                  </button>
                                </div>
                              </div>

                              <!-- Two-column: sidebar + main content -->
                              <div class="two-columns">

                                <!-- Sidebar filters -->
                                <aside class="research-sidebar">
                                  <a href="index.html" class="back-link">
                                    <i class="fas fa-arrow-left"></i> Search in all content
                                  </a>
                                  <div class="filter-section-label">Filters for Activities</div>

                                  <!-- SDG filter -->
                                  <div class="filter-group">
                                    <div class="filter-heading">Sustainable Development Goals</div>
                                    <div id="sdgContainer">
                                      <div id="sdgList"></div>
                                      <button id="toggleSdgBtn" class="toggle-sdg">Show more ›</button>
                                    </div>
                                  </div>

                                  <!-- Year range slider -->
                                  <div class="filter-group">
                                    <div class="filter-heading">Year</div>
                                    <div class="year-slider-wrap">
                                      <div class="year-track-outer">
                                        <!-- Floating labels above thumbs -->
                                        <div class="year-floating-labels">
                                          <span class="year-float-label" id="yearMinLabel">–</span>
                                          <span class="year-float-label" id="yearMaxLabel">–</span>
                                        </div>
                                        <div class="year-track">
                                          <div class="year-fill" id="yearFill"></div>
                                          <input type="range" id="yearRangeMin">
                                          <input type="range" id="yearRangeMax">
                                        </div>
                                      </div>
                                      <div class="year-minmax">
                                        <span id="yearAbsMin"></span>
                                        <span id="yearAbsMax"></span>
                                      </div>
                                    </div>
                                    <div id="yearFilters" style="display:none"></div>
                                  </div>

                                  <!-- Type filter -->
                                  <div class="filter-group">
                                    <div class="filter-heading">Type</div>
                                    <div id="typeDetailContainer">
                                      <div id="typeDetailList"></div>
                                      <button id="toggleTypeBtn" class="toggle-type">Show more ›</button>
                                    </div>
                                  </div>

                                  <!-- Profile links -->
                                  <div class="filter-group">
                                    <div class="filter-heading">Profiles</div>
                                    <div class="profile-links">
                                      <a href="https://scholar.google.com/citations?user=LG2mrO4AAAAJ" target="_blank">Google Scholar</a>
                                      <a href="https://orcid.org/0000-0002-6976-4733" target="_blank">ORCID</a>
                                      <a href="https://ideas.repec.org/f/pni504.html" target="_blank">IDEAS/RePec</a>
                                    </div>
                                  </div>
                                </aside>

                                <!-- Main content: search + results -->
                                <div class="main-content">
                                  <div class="search-section">
                                    <div class="search-heading">Find Research Activities</div>
                                    <div class="search-input-wrapper">
                                      <i class="fas fa-search"></i>
                                      <input type="text" id="searchInput" placeholder="Search by title, description...">
                                      <div class="search-divider"></div>
                                      <div class="search-modes">
                                        <span class="search-mode-btn active"><i class="fas fa-lightbulb"></i> concept</span>
                                        <span class="search-mode-btn"><i class="fas fa-align-left"></i> matching text</span>
                                      </div>
                                    </div>
                                  </div>

                                  <div class="sort-bar">
                                    <span class="result-count" id="resultCount">0 results</span>
                                    <span class="sort-divider">|</span>
                                    <button id="sortBtn" class="sort-btn">Start date (descending) <i class="fas fa-arrow-down"></i></button>
                                    <button id="exportBtn" class="export-btn"><i class="fas fa-download"></i> Export results</button>
                                  </div>

                                  <div id="activitiesContainer"></div>
                                  <div id="paginationContainer" class="pagination"></div>
                                </div>

                              </div><!-- end .two-columns -->
                            </div><!-- end .research-container -->

                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="node_view"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

    <!-- ✅ FOOTER SLOT — components.js injects pre-footer + footer here -->
    <div id="site-footer"></div>

    <!-- ✅ back-to-top is injected automatically by components.js -->

  </div><!-- /dialog-off-canvas-main-canvas -->

  <!-- ✅ components.js MUST come first -->
  <script src="static/js/components.js"></script>
  <script src="static/js/darkmode.js"></script>
  <script src="static/js/search.js"></script>

  <!-- Page-specific scripts (only on activity.html) -->
  <script src="static/js/activity-data.js"></script>
  <script src="static/js/activity-widget.js"></script>

</body>
</html>
